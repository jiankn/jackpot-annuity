name: Publish npm package
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance
# Configure npm Trusted Publishing for jiankn/jackpot-annuity and this
# publish.yml file before running. No npm token is stored in the repository.
